[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = root
stdout_callback = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_timeout = 86400
fact_caching_connection = /tmp/micro_ops_ansible_fact_cache
any_errors_fatal = true
# still run notified handlers when something fails
force_handlers = true
forks = 8

[ssh_connection]
pipelining = true
# ServerAlive*: keep up connection for up to ~10min of silence
ssh_args = -o ForwardAgent=yes -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=30s -o ServerAliveInterval=30 -o ServerAliveCountMax=20

[persistent_connection]
command_timeout = 30
