---
# plz change these if you are not me thx
operator_contact: "@bad-example.com"
operator_email: phil@bad-example.com

node_exporter_version: "1.9.1"
node_exporter_arch: linux-amd64 # override in host_vars for hosts on others

node_exporter_port: 9100
node_exporter_listen: "{{ tailscale_ip }}:{{ node_exporter_port }}"
node_exporter_textfile_dir: /var/lib/node_exporter/textfile

# prometheus-community/node-exporter-textfile-collector-scripts, for apt_info.py
os_updates_apt_info_ref: 642e365cd4e99a1f5cfe9b6b1756cfc27da066b8
os_updates_auto_reboot: false

nginxlog_exporter_version: "1.11.0"
nginxlog_exporter_arch: linux_amd64
nginxlog_exporter_address: "{{ tailscale_ip }}"
nginxlog_exporter_port: 4044

disk_alert_warn_free: 0.15 # 7-day minimum
disk_alert_urgent_free: 0.05 # current usage

# shared for nginx / nginxlog_exporter (metrics)
nginx_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $upstream_cache_status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time'
