---
# public sites. upstream blocks, certs, log files, log-exporter namespaces.
# per-site nginx tuning at roles/gateway/templates/sites/<name>.conf.j2
gateway_sites:
  - name: constellation.microcosm.blue
    log: constellation # <log>-access.log, exporter namespace, `cozy_<log>` upstream
    upstream_port: 6789
    upstreams:
      - host: mikrokosmos
      - host: orion
        backup: true

  - name: ufos-api.microcosm.blue
    log: ufos
    upstream_port: 9999
    upstreams:
      - host: mikrokosmos
      - host: cooper
        backup: true

  - name: spacedust.microcosm.blue
    log: spacedust
    upstream_port: 9998
    upstreams:
      - host: arietids

  # ancient, deprecated, redirects. gets ~dozen or so real-seeming hits per day?
  - name: links.bsky.bad-example.com

# access log format is coupled to metrics (log exporter reads it)
gateway_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $upstream_cache_status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for" $request_time'

# debian default 768 is low enough to hit in prod
gateway_worker_connections: 2048

# nginx default is very slow, 60s; connects should always be fast.
# fails everything over to the backup.
gateway_upstream_connect_timeout: 2s

# failover to `backup` upstreams. currently nginx defaults here (see lino host)
gateway_proxy_next_upstream: error timeout
gateway_upstream_max_fails: 1
gateway_upstream_fail_timeout: 10s

gateway_acme_webroot: /var/lib/acme-webroot
gateway_acme_peer_port: 8402 # tailnet-only challenge forwards between gateways

nginxlog_exporter_version: "1.11.0"
nginxlog_exporter_arch: linux_amd64
nginxlog_exporter_address: "{{ tailscale_ip }}" # scraped over the tailnet
nginxlog_exporter_port: 4044

# for $request_time (`nginx_http_response_time_seconds_hist`).
# fast buckets for cache hits, others around thresholds: cache (1/2s, 3/8s),
# read timeouts (5s, 10s), spacedust's 60s.
# websockets time the whole session, mostly in +Inf (filter out by status=101)
nginxlog_exporter_histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2, 3, 5, 8, 10, 30, 60]

scrape_targets:
  - job: host
    port: "{{ node_exporter_port }}"
    labels:
      role: gateway
  - job: nginx
    port: "{{ nginxlog_exporter_port }}"
    labels:
      role: gateway
