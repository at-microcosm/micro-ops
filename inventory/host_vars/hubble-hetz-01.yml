---
ansible_host: hubble-hetz-01
tailscale_ip: 100.68.37.126
hubble_public_host: hetz-test-hubble.microcosm.blue
hubble_extra_public_hosts:
  - hubble.microcosm.blue
hubble_root_redirect: https://web.hubble.microcosm.blue

hubble_version: backup

# push backups to hubble_big's tigris bucket. tigris is virtual-hosted style,
# so the bucket goes in the hostname and hubble_backup_bucket stays unset.
hubble_backup_enabled: true
hubble_backup_endpoint: "https://{{ hubble_big_tigris_bucket }}.{{ hubble_big_tigris_endpoint | urlsplit('hostname') }}"
hubble_backup_access_key_id: "{{ hubble_big_tigris_access_key_id }}" # secrets.yml
hubble_backup_secret_access_key: "{{ hubble_big_tigris_secret_access_key }}"
hubble_backup_interval: 12h # x6 retained = 3 days of restore points
hubble_backup_initial_delay: 3m # just to check the setup works; drop once it has

hubble_mode_args:
  - --upstream bsky.network
  - --upstream-mode-relay
  - --deep-crawl

hubble_tuning_args:
  - --repo-backpressure-retry-sleep 200
  - --repo-backpressure-max-retries 2048
  - --max-repo-actors 32768
  - --max-resync-concurrency 4096
  - --max-big-repo-resync-concurrency 256
  - --rocksdb-background-jobs 16
  - --rocksdb-cache-mb 24576
  - --rocksdb-statistics
  - --repo-sst-ingest-threshold-mb 8 # ingests always go to L0: we skip WAL and bypass memtable
  - --max-plc-scheduled-requests 128
  - --zstd-level 6
  - --gzip-level 6
