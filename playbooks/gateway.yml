---
- name: Deploy gateway
  hosts: gateway
  become: true
  serial: 1 # one at a time, so if something breaks we don't take both down
  roles:
    - base
    - role: nginx
      nginx_names: "{{ gateway_sites | map(attribute='name') | list }}"
      nginx_acme_peer_group: gateway
    - gateway
    - role: nginxlog_exporter
      nginxlog_exporter_logs: "{{ gateway_sites | selectattr('log', 'defined') | map(attribute='log') | list }}"
      nginxlog_exporter_format: "{{ nginx_log_format }}"
    - role: cert_check
      cert_check_names: "{{ gateway_sites | map(attribute='name') | list }}"
