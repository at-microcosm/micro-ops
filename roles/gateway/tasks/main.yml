---
# public reverse proxy: nginx in front of services at the house, over the
# tailnet.
#
# should go after roles/nginx (base config, certs, etc).

- name: make sure upstream hosts have tailnet addresses
  ansible.builtin.assert:
    that: hostvars[item].tailscale_ip | default('') is match('^100[.][0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: "{{ item }} needs a real tailscale_ip in its host_vars"
    quiet: true
  loop: "{{ gateway_upstream_hosts }}"

- name: "deps"
  ansible.builtin.apt:
    name:
      - ufw # only so allowing web ports works
    update_cache: true
    cache_valid_time: 3600

# these do nothing where ufw is inactive
- name: allow http + https through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: install gateway http config
  ansible.builtin.template:
    src: gateway.conf.j2
    dest: /etc/nginx/conf.d/gateway.conf
  notify: reload nginx

- name: install site configs
  ansible.builtin.template:
    src: "sites/{{ site.name }}.conf.j2"
    dest: "/etc/nginx/sites-available/{{ site.name }}"
  loop: "{{ gateway_live_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.name }}"
  notify: reload nginx

- name: enable site configs
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ site.name }}"
    dest: "/etc/nginx/sites-enabled/{{ site.name }}"
    state: link
  loop: "{{ gateway_live_sites }}"
  loop_control:
    loop_var: site
    label: "{{ site.name }}"
  notify: reload nginx
