---
# handlers run in file order, so `nginx -t` happens before systemd `reloaded`

- name: check nginx config
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: reload nginx

- name: reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: restart logrotate timer
  ansible.builtin.systemd_service:
    name: logrotate.timer
    state: restarted
    daemon_reload: true
