---
# nginx reverse proxy + certbot for acme tls
#
# certbot edits the nginx host file to add its tls config, so we template it on
# first create (force: false) to avoid clobbering on re-runs. remove the nginx
# host file and then run to make changes stick.
#
# most of the time that shouldn't matter: location-level config is in a separate
# nginx file that gets `include`d by the host config, which can be changed
# without conflict with certbot.

- name: install deps
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    update_cache: true
    cache_valid_time: 3600

- name: server_tokens off
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*#?\s*server_tokens\b'
    line: "    server_tokens off;"
    insertafter: '^http\s*{'
  register: nginx_server_tokens

- name: remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: install locations config for {{ nginx_tls_host }}
  ansible.builtin.template:
    src: locations.j2
    dest: /etc/nginx/snippets/{{ nginx_tls_host }}.conf
    force: true # ansible-owned
  register: nginx_snippet

- name: add nginx vhost for {{ nginx_tls_host }}
  ansible.builtin.template:
    src: host.j2
    dest: /etc/nginx/sites-available/{{ nginx_tls_host }}
    force: false # don't clobber certbot's in-place tls edits
  register: nginx_vhost

- name: enable vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ nginx_tls_host }}
    dest: /etc/nginx/sites-enabled/{{ nginx_tls_host }}
    state: link

- name: check nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

# snippet-only changes just reload
- name: enable and (re)start nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: >-
      {{ 'restarted' if (nginx_vhost.changed or nginx_server_tokens.changed)
         else ('reloaded' if nginx_snippet.changed else 'started') }}
    enabled: true

- name: check for existing certs
  ansible.builtin.command: certbot certificates
  register: certbot_certs
  changed_when: false
  check_mode: false  # ansible doesn't run scripts in check-mode so skip

# --cert-name is like the main tls name? --expand adds more tls names
#
# runs when any name is missing a cert, + when host file is (re)created
- name: obtain cert and configure nginx tls
  ansible.builtin.command: >-
    certbot run --nginx -n --agree-tos --expand
    --cert-name {{ nginx_tls_host }}
    -m {{ operator_email }}
    -d {{ nginx_tls_all_hosts | join(' -d ') }}
  when: >-
    nginx_vhost.changed
    or nginx_tls_all_hosts | reject('in', certbot_certs.stdout) | list | length > 0
