---
# bind an IP which doesn't exist yet during early boot (like tailscale ips).
# lets sockets always bind, start working when the IP actually appears.

- name: allow binding non-local addresses
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    sysctl_file: /etc/sysctl.d/30-nonlocal-bind.conf
    sysctl_set: true
