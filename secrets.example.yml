---
# copy to secrets.yml
# run playbooks with: `-e @secrets.yml`

# for bridgy-hubble, which accepts our authed getRepo requests specifically
bridgy_upstream_getrepo_token: ...

# hubble_big's tigris bucket, for its rocksdb backups (wired up in host_vars)
hubble_big_tigris_access_key_id: ...
hubble_big_tigris_secret_access_key: ...

# healthchecks.io ping key (project settings)
healthchecks_ping_key: ...

# email gateway for monitor alerts
alerts_smtp_host: ...
alerts_smtp_port: 587
alerts_smtp_username: ...
alerts_smtp_password: ...
alerts_smtp_from: ...
alerts_smtp_to: ...

alerts_webhook_discord: ...
